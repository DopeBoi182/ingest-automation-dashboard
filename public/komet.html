<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Komet Dashboard</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Komet Dashboard</h1>
      <div class="top-nav">
        <a href="./" class="nav-link">Ingestion</a>
        <a href="./s3.html" class="nav-link">S3 Fetcher</a>
        <a href="./komet.html" class="nav-link active">Komet</a>
      </div>

      <section class="card">
        <h2>KOMET DB Checker</h2>
        <div class="actions">
          <label for="kometTrustCertToggle">Trust Server Certificate</label>
          <input type="checkbox" id="kometTrustCertToggle" />
          <button type="button" id="kometApplyTlsBtn" class="secondary">Apply + Reconnect</button>
        </div>
        <div class="actions">
          <label for="kometTableSelect">Table</label>
          <select id="kometTableSelect">
            <option value="">-- list tables first --</option>
          </select>
        </div>
        <div class="actions">
          <button type="button" id="kometConnectionCheckBtn">Check DB Connection</button>
          <button type="button" id="kometListTablesBtn" class="secondary">List Available Tables</button>
          <button type="button" id="kometFetchBtn" class="secondary">Fetch TOP 1000 (SELECT *)</button>
        </div>
        <pre id="kometConnectionOutput">Not checked yet.</pre>
      </section>

      <section class="card">
        <h2>Raw Query Output</h2>
        <pre id="kometRawOutput">No data loaded yet.</pre>
      </section>

      <p id="statusText" class="status">Ready.</p>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="./js/komet.js"></script>
  </body>
</html>
